<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Ruck Zuck – Meta-Brillen-Detektor: Brille mit roter Fassung -->
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#0d1013"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="#e5231b" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Bügel links / rechts -->
    <path d="M22 44 L6 34"/>
    <path d="M106 44 L122 34"/>

    <!-- Brücke -->
    <path d="M55 52 q9 -8 18 0"/>

    <!-- linke Fassung -->
    <rect x="14" y="44" width="42" height="34" rx="14" fill="url(#lens)"/>
    <!-- rechte Fassung -->
    <rect x="72" y="44" width="42" height="34" rx="14" fill="url(#lens)"/>
  </g>

  <!-- kleines Glanzlicht auf den Gläsern -->
  <g fill="#ffffff" opacity="0.18">
    <ellipse cx="26" cy="56" rx="7" ry="4"/>
    <ellipse cx="84" cy="56" rx="7" ry="4"/>
  </g>
</svg>
