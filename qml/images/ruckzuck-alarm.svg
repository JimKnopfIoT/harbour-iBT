    <rect x="24" y="58" width="34" height="28" rx="11" fill="url(#lens2)"/>
    <rect x="70" y="58" width="34" height="28" rx="11" fill="url(#lens2)"/>
  </g>
  <g fill="#ffffff" opacity="0.18">
