  </defs>

  <!-- Warn-Glow + Ring -->
  <circle cx="64" cy="64" r="60" fill="url(#glow)"/>
  <circle cx="64" cy="64" r="57" fill="none" stroke="#e5231b" stroke-width="6"/>

